[project]
name = "si618-fa2026"
version = "2026.08.24"
description = "SI 618: Data Manipulation & Analysis — Fall 2026, University of Michigan School of Information"
requires-python = ">=3.12,<3.14"

dependencies = [
    # --- Notebook environment ---
    # Pinned exactly: every student and grader runs the same marimo.
    "marimo==0.24.0",

    # --- Core data stack ---
    "pandas>=3.0,<4.0",
    "numpy>=2.1,<3.0",
    "pyarrow>=18.0",

    # --- Visualization ---
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<0.14",

    # --- Statistics ---
    "scipy>=1.14",
    "statsmodels>=0.14,<0.15",

    # --- Machine learning ---
    "scikit-learn>=1.6,<2.0",

    # --- Text / NLP ---
    # nltk dropped Oct 19 in favour of spaCy, scikit-learn vectorisers and model2vec.
    # OpenCC converts traditional to simplified Chinese for HW 4.
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "spacy>=3.8,<4.0",
    # spaCy's small English model is published as a wheel, not on PyPI.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Small static embedding models (no PyTorch); 07b loads minishlab/potion-base-8M.
    "model2vec>=0.10,<0.11",

    # --- Scaling up (weeks 12-13) ---
    "polars>=1.20,<2.0",
    "duckdb>=1.1,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
# marimo notebooks are .py files; collect tests from them directly.
python_files = ["test_*.py", "*_test.py", "SI_618_*.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# marimo notebooks are generated; don't fight the file format.
#   E402/F841 — cells import and assign in ways ruff reads as dead code
#   PLR1711   — every marimo cell ends in `return`
#   B018      — a bare expression at the end of a cell is how marimo shows output
#   PIE790    — `pass  # TODO` is the exercise stub students replace
ignore = ["E402", "F841", "PLR1711", "B018", "PIE790"]

[tool.marimo.runtime]
# marimo's own default leaves every cell stale on open, so a freshly-opened
# notebook shows "this cell has not been run yet" everywhere and reactivity
# appears broken. Run the notebook on open instead.
#
# This has to live here rather than in each notebook's PEP 723 header: marimo
# strips runtime.auto_instantiate from notebook metadata on purpose, so that a
# downloaded notebook cannot make itself execute.
auto_instantiate = true
